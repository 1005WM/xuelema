name: Android verification
on:
  push:
    branches:
      - main
      - fix/multi-blank-answer-fill
      - fix/startup-refresh-and-ai-scroll
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/js/package-lock.json
      - run: npm ci --prefix tools/js
      - run: npm test --prefix tools/js
  android:
    needs: javascript
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Prepare existing signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "::error::Existing signing key configured without all required passwords/alias."
              exit 1
            fi
            signing_file="$RUNNER_TEMP/xuelema-existing.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            chmod 600 "$signing_file"
            printf 'ANDROID_SIGNING_STORE_FILE=%s\n' "$signing_file" >> "$GITHUB_ENV"
            printf 'ANDROID_SIGNING_CONFIGURED=true\n' >> "$GITHUB_ENV"
          else
            printf 'ANDROID_SIGNING_CONFIGURED=false\n' >> "$GITHUB_ENV"
            echo "::notice::No original signing key configured. This debug APK cannot be claimed as an update for an existing installation."
          fi
      - name: Build and verify
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for UI regression tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation and answer-scroll device regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -camera-back none
          script: gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.homeworkassistant.HomeworkStatusUpdateTest,com.homeworkassistant.AiAnswerScrollTest
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XieLeMa-0.3.12-debug.apk
      - name: Verify APK signature and record certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs XieLeMa-0.3.12-debug.apk > signing-certificate.txt
          printf '\nExisting signing key configured: %s\n' "$ANDROID_SIGNING_CONFIGURED" >> signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XieLeMa-0.3.12-debug
          path: |
            XieLeMa-0.3.12-debug.apk
            signing-certificate.txt
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
